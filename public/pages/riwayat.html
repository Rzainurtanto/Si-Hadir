<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Riwayat Presensi · SI-HADIR</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Doto:wght,ROND@900,100&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="theme-pink">
  <div class="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>

      <main class="card panel">
        <div class="panel-head">
          <div>
            <h1 class="panel-title">Riwayat Presensi</h1>
            <button type="button" class="date-chip" id="date-btn">
              <i data-icon="calendar"></i><span data-date-label></span><i data-icon="chevronDown" class="caret"></i>
            </button>
          </div>
          <div class="panel-tools">
            <label>
              <span class="sr-only">Pilih sesi</span>
              <select class="select" id="session-select"></select>
            </label>
            <label class="search">
              <i data-icon="search"></i>
              <span class="sr-only">Cari mahasiswa</span>
              <input type="search" id="search" placeholder="Cari Mahasiswa" autocomplete="off">
            </label>
            <button type="button" class="btn btn-light btn-sm" id="export-btn"><i data-icon="download"></i>Export CSV</button>
          </div>
        </div>

        <div class="table-wrap">
          <table class="data">
            <thead id="log-head"></thead>
            <tbody id="log-body"></tbody>
          </table>
        </div>
        <div id="log-empty"></div>
        <div class="table-foot"><span id="log-summary"></span><span id="log-count"></span></div>
      </main>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/riwayat.js"></script>
</body>
</html>
