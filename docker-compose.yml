services:
  sihadir:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sihadir_app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/app/data/sihadir.db
      - DEVICE_KEY=${DEVICE_KEY:-}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - AUTO_SEED=${AUTO_SEED:-false}
    volumes:
      # Data SQLite tersimpan langsung di server host agar tidak hilang saat redeploy/restart
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
